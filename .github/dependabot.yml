version: 2
updates:
  - package-ecosystem: 'npm' # troque para "pip", "docker" etc. conforme a stack
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels: ['dependencies']
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels: ['dependencies', 'ci']
