name: OWASP ZAP Baseline (DAST)

# Só faz sentido se o projeto expõe uma aplicação web/API.
# Ajuste a URL de destino e remova este workflow se não for aplicável.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: '<preencher: https://staging.seuprojeto.com>'
          fail_action: false
